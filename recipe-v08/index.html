<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; connect-src 'self' https://cdn.jsdelivr.net; frame-src 'self' about:; img-src blob: data:; media-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>共通MV制作 V08｜既存900FのMP4結合</title><style>
:root{color-scheme:light dark;font:100% system-ui}*{box-sizing:border-box}body{margin:0;line-height:1.65}main{max-width:44rem;margin:auto;padding:1rem}section{border:1px solid #888;border-radius:.75rem;padding:1rem;margin:1rem 0}button,input{font:inherit;max-width:100%}button{width:100%;min-height:48px;border:1px solid #777;border-radius:.5rem;margin:.4rem 0;padding:.5rem;background:#2057a5;color:white;font-weight:650}button:disabled{background:#666}label{display:block;font-weight:650}input[type=file]{width:100%;min-height:48px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.85rem}iframe{width:100%;height:25rem;border:1px solid #888;border-radius:.5rem}h1{font-size:1.5rem}h2{font-size:1.2rem}:focus-visible{outline:3px solid #b45500;outline-offset:3px}a{color:inherit}[hidden]{display:none!important}#status{padding:.5rem;border:1px solid #888;border-radius:.5rem}progress{width:100%}
</style></head><body><main><h1>V08｜Dear Ga Ga. 30秒MP4結合</h1><p>承認済みV13の全900フレームを読み取り専用で再利用。再描画・映像再エンコード・原本変更は禁止。原曲からAAC音声を合成します。</p><section><h2>1. 原曲を選択</h2><label for="wav">V07で照合した原曲WAV</label><input id="wav" type="file" accept=".wav,audio/wav"><button id="go" disabled>動画生成開始（既存900Fの結合のみ）</button><button id="stop" disabled>停止</button><p>Safariを前面にしたまま実行してください。不一致では停止し、自動再試行しません。</p></section><section><h2>2. 進捗</h2><label for="progress">結合前検査の進捗</label><progress id="progress" max="900" value="0"></progress><p id="status" role="status" aria-live="polite" aria-atomic="true">原曲選択待ち</p></section><section id="result" hidden><h2>3. 完成MP4</h2><video id="video" controls playsinline preload="metadata" style="width:100%;max-height:320px"></video><p>実際の再生・聴感は本人確認が必要です。</p><a id="save" download="DearGaGa_V08_30s.mp4" hidden>MP4を保存</a><button id="share" hidden>共有・ファイルに保存</button></section><section><h2>検査結果</h2><button id="copy">結果をコピー</button><label for="log">技術報告</label><textarea id="log" readonly style="width:100%;min-height:180px;font:12px monospace"></textarea></section><iframe id="adapter" title="既存V05結合処理" sandbox="allow-scripts allow-same-origin" hidden></iframe><noscript>JavaScriptが無効です。</noscript></main><script>
'use strict';
const BRIDGE_SOURCE="\n const V07_PINS=[[3547810,\"9d94f6f2a7009172841d019c7be97cde1ead61d1d638652b3f361cc5effdee61\"],[3386369,\"2b8ba1617574640b30c5ac7bfe04d77bcca2a4713db16fd5d219f859ce73bdec\"],[3275747,\"6bf17cd764423bbd4bf0ae21b25dce035f1e785d51cc1892624e0a2a7ea9fafa\"],[3267915,\"4ee1a069f7925150341cf4ddf36295b5a46c3f18dc7a16690d34de97da59f74e\"],[3420601,\"7a11d3ddf33ab9d681fc829632cf3f646d37498e266a0cfb0e72a91a867348de\"]];\n let snapshot=null,muxPermit=false,reportHook=null;\n  async function readApprovedRecords(){\n  const name=\"suilemo-v13-real-music-30s-v1\";\n  check(typeof indexedDB!==\"undefined\"&&typeof indexedDB.databases===\"function\",\"既存保存領域を安全に確認できません\");\n  const list=await indexedDB.databases();\n  check(list.some(x=>x.name===name),\"既存V13保存領域なし。再描画禁止\");\n  let db=null;\n  try{\n   db=await new Promise((resolve,reject)=>{\n    const req=indexedDB.open(name);\n    req.onupgradeneeded=()=>{req.transaction.abort();reject(Error(\"V07: no database creation or upgrade\"))};\n    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error(\"V13 database busy\"));\n   });\n   check(db.objectStoreNames.contains(\"segments\"),\"existing checkpoint store missing\");\n   const records=await new Promise((resolve,reject)=>{\n    const tx=db.transaction(\"segments\",\"readonly\"),store=tx.objectStore(\"segments\"),items=[];\n    const req=store.openCursor();\n    req.onsuccess=()=>{const cur=req.result;if(cur){if(items.length>=PARTS){tx.abort();return}items.push(cur.value);cur.continue()}};\n    tx.oncomplete=()=>resolve(items);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(Error(\"checkpoint inventory stopped\"));\n   });\n\n   check(records.length===PARTS&&records.every((r,i)=>validRecord(r,i)&&r.imported!==true&&r.bytes===V07_PINS[i][0]&&r.sha256===V07_PINS[i][1]),\"V07の5区間と不一致。再描画禁止\");\n   return records;\n  }finally{db?.close()}\n }\n\n \n async function approvedMux(file,onReport,isStopped){\n  check(!GENERATION_ALLOWED&&!muxPermit&&!snapshot,\"V08 scope lock\");\n  check(file&&typeof onReport===\"function\"&&typeof isStopped===\"function\",\"原曲・実行入口が必要です\");\n  const data={version:\"V08\",project:\"Dear Ga Ga.\",scope:\"approved_900_frame_mux_only\",approval:\"V08動画生成開始\",prior:\"V07 verified 5 segments; V05 GPU reused\",status:\"RUNNING\",stage:\"inputs\",requested:{width:W,height:H,fps:FPS,frames:N,seconds:D},generation_authorized:true,rendered:false,video_reencoded:false,checkpoint_written:false,media_generated:false,segments:[],committed_frames:0,playback:\"UNVERIFIED\"};\n  const start=performance.now();\n  const guard=()=>{check(!isStopped(),\"stopped by user\");check(!document.hidden,\"Safari moved to background\");check(performance.now()-start<300000,\"5 minute limit; original segments retained\")};\n  reportHook=onReport;\n  try{\n   show(data);guard();data.audio_source=await readSource(file);guard();\n   data.storage=storageGate(await navigator.storage.estimate());check(data.storage.pass,\"storage gate\");\n   snapshot=await deadline(readApprovedRecords(),25000,\"read-only checkpoint inventory\");guard();\n   data.stage=\"checkpoint_packet_qa\";show(data);\n   const M=await deadline(import(\"https://cdn.jsdelivr.net/npm/mediabunny@1.66.2/+esm\"),30000,\"Mediabunny\");\n   const verified=[];\n   for(let i=0;i<PARTS;i++){\n    guard();const q=await inspectPart(M,snapshot[i],i,guard);\n    if(i>0){const l=verified[i-1].frames,r=q.frames;check(q.meta.config_signature===verified[0].meta.config_signature,\"AVC configuration mismatch\");check(boundaryGate(mad(l[SEG-1],r[0]),mad(l[SEG-2],l[SEG-1]),mad(r[0],r[1])),\"checkpoint boundary mismatch\")}\n    verified.push(q);data.segments.push({id:i,frames:SEG,bytes:q.meta.bytes,sha256:q.meta.sha256,source:\"reused\",packet_qa:\"PASS\"});data.committed_frames=(i+1)*SEG;show(data);await delay();\n   }\n   guard();data.stage=\"assemble\";show(data);muxPermit=true;\n   let output;try{output=await assemble(M,data,guard,verified)}finally{muxPermit=false}\n   guard();data.media_generated=true;data.audio_encoded=true;data.stage=\"final_qa\";show(data);\n   data.file=await deadline(probeFile(M,output,verified,guard),120000,\"final MP4 QA\");guard();\n   check(evaluate(data.file)&&data.file.visual.pass===true&&data.file.audio.pass===true,\"final technical QA failed\");\n   data.stage=\"complete\";data.status=\"PASS_TECHNICAL_PLAYBACK_PENDING\";data.elapsed_s=Number(((performance.now()-start)/1000).toFixed(2));data.playback=\"USER_CHECK_REQUIRED\";show(data);\n   return {report:data,blob:output};\n  }catch(e){data.status=isStopped()?\"STOPPED\":\"BLOCK\";data.error=String(e);show(data);throw e}\n  finally{muxPermit=false;snapshot=null;reportHook=null;sourcePCM=null;envelope=null}\n }\n \n";

function prepareAdapter(html){
 check(html.includes('const GENERATION_ALLOWED=false,SCENE_READY=true;')&&html.includes('V05: checkpoint access prohibited'),'V05 safety lock mismatch');
 html=once(html,'function show(data){report.value=JSON.stringify(data,null,2);}','function show(data){reportHook?.(data);}');
 html=once(html,'const getPart=id=>dbOp("readonly",o=>o.get(id));','const getPart=async id=>{check(muxPermit&&snapshot&&Number.isInteger(id)&&id>=0&&id<PARTS,"V08 read-only snapshot gate");return snapshot[id]};');
 html=once(html,'async function assemble(m,data,guard,verified){\n generationGate();','async function assemble(m,data,guard,verified){\n check(muxPermit&&snapshot?.length===PARTS&&verified.length===PARTS,"V08 exact mux scope required");');
 html=once(html,'return Object.freeze({bindingCheck,probe,verifyLocalAudio:readSource});',BRIDGE_SOURCE+'\n return Object.freeze({approvedMux});');
 html=once(html,"$('demo').addEventListener('click'", "window.v08Mux=async(file,report,stop)=>{const engine=createBoundEngine(DEMO);return engine.approvedMux(file,report,stop)};\n$('demo').addEventListener('click'");
 return html;
}


const $=id=>document.getElementById(id);
function check(ok,msg){if(!ok)throw Error(msg)}
function once(s,a,b){check(s.split(a).length===2,"protected source structure mismatch");return s.replace(a,()=>b)}
const hex=b=>Array.from(new Uint8Array(b),v=>v.toString(16).padStart(2,"0")).join("");
let busy=false,stopped=false,engine=null,finalBlob=null,finalUrl=null,last=null;
function status(s){$("status").textContent=s}
function report(r){last=JSON.parse(JSON.stringify(r));$("log").value=JSON.stringify(last,null,2);$("progress").value=r.committed_frames||0;
 const labels={inputs:"原曲・保存区間を確認中",checkpoint_packet_qa:"結合前検査",assemble:"既存映像と原曲を結合中",final_qa:"完成MP4検証中",complete:"技術検証完了。再生情報を確認中"};
 status(r.status==="RUNNING"?(labels[r.stage]||r.stage)+"｜"+(r.committed_frames||0)+" / 900F":r.status==="PASS_TECHNICAL_PLAYBACK_PENDING"?"技術検証合格。再生確認へ":r.status+"："+(r.error||""))}
async function loadEngine(){
 if(engine)return engine;
 const r=await fetch("../recipe-v05/index.html",{cache:"no-store",credentials:"same-origin",redirect:"error"});check(r.ok,"V05取得失敗");
 const b=new Uint8Array(await r.arrayBuffer()),h=new TextEncoder().encode("blob "+b.length+"\0"),x=new Uint8Array(h.length+b.length);x.set(h);x.set(b,h.length);
 check(hex(await crypto.subtle.digest("SHA-1",x))==="d36b4c236036e48465615a69a144f91e8f411f41","V05原本SHA不一致");
 const page=prepareAdapter(new TextDecoder("utf-8",{fatal:true}).decode(b)),f=$("adapter");
 await new Promise((resolve,reject)=>{const timer=setTimeout(()=>{f.onload=null;reject(Error("V05起動時間切れ"))},15000);f.onload=()=>{clearTimeout(timer);f.onload=null;resolve()};f.srcdoc=page});
 check(typeof f.contentWindow?.v08Mux==="function","V08結合入口未接続");engine=f.contentWindow.v08Mux;return engine;
}
function clearResult(){const v=$("video");v.pause();v.removeAttribute("src");v.load();if(finalUrl)URL.revokeObjectURL(finalUrl);finalUrl=null;finalBlob=null;$("result").hidden=true;$("save").hidden=true;$("share").hidden=true}
async function mediaMetadata(blob){
 const v=$("video");$("result").hidden=false;finalUrl=URL.createObjectURL(blob);
 return await new Promise((resolve,reject)=>{const done=()=>{clearTimeout(timer);v.removeEventListener("loadedmetadata",ok);v.removeEventListener("error",bad)};
 const ok=()=>{done();resolve({width:v.videoWidth,height:v.videoHeight,duration:v.duration})};const bad=()=>{done();reject(Error("Safari MP4 metadata error"))};
 const timer=setTimeout(()=>{done();reject(Error("Safari metadata timeout"))},15000);v.addEventListener("loadedmetadata",ok);v.addEventListener("error",bad);v.src=finalUrl;v.load();if(v.readyState>=1)ok()})
}
$("wav").addEventListener("change",()=>{$("go").disabled=busy||!!finalBlob||!$("wav").files[0];status($("go").disabled?"原曲選択待ち・または結合済み":"原曲選択済み。結合開始できます。")});
$("stop").addEventListener("click",()=>{stopped=true;status("停止要求。原本は保持されます。")});
$("go").addEventListener("click",async()=>{
 if(busy||finalBlob||!$("wav").files[0])return;busy=true;stopped=false;$("wav").disabled=true;$("go").disabled=true;$("stop").disabled=false;$("progress").value=0;last=null;$("log").value="";
 try{
  clearResult();status("V05原本を接続中");const fn=await loadEngine();check(!stopped,"stopped by user");
  const r=await fn($("wav").files[0],report,()=>stopped||document.hidden);check(!stopped,"stopped by user");
  check(r.report.status==="PASS_TECHNICAL_PLAYBACK_PENDING"&&r.blob?.size===r.report.file.bytes,"MP4 report mismatch");
  const meta=await mediaMetadata(r.blob);check(meta.width===1920&&meta.height===1080&&Math.abs(meta.duration-30)<=.10,"Safari metadata mismatch");
  finalBlob=r.blob;last.safari_metadata=meta;last.playback="USER_CHECK_REQUIRED";$("log").value=JSON.stringify(last,null,2);
  $("save").href=finalUrl;$("save").hidden=false;$("share").hidden=false;status("技術検証合格。MP4を再生・保存してください。");
 }catch(e){clearResult();last={...(last||{}),status:stopped?"STOPPED":"BLOCK",error:String(e),rendered:false,video_reencoded:false,checkpoint_written:false};$("log").value=JSON.stringify(last,null,2);status("停止："+e.message+"。原本・保存済み区間は保持。")}
 finally{busy=false;$("wav").disabled=!!finalBlob;$("stop").disabled=true;$("go").disabled=!!finalBlob||!$("wav").files[0]}
});
$("share").addEventListener("click",async()=>{if(!finalBlob)return;try{const f=new File([finalBlob],"DearGaGa_V08_30s.mp4",{type:"video/mp4"});check(navigator.canShare?.({files:[f]}),"共有非対応。MP4保存リンクを利用してください");await navigator.share({files:[f]})}catch(e){if(e.name!=="AbortError")status(e.message)}});
$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("log").value)}catch{$("log").focus();$("log").select()}});

</script></body></html>
