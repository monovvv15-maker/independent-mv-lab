 s=once(s,'const DBNAME="suilemo-v13-real-music-30s-v1",RECIPE="v13-30s-v01-art-adapter",IDENTITY=[DESIGN,SOURCE_SHA,REF_SHA,ZIP_SHA].join(":");','const DBNAME="V12_NO_DB",RECIPE="SUSHI-JARO-V12-C01-150",IDENTITY="e86b1d9d6bb03068f0b88ad3c1830912c7e85e9318a0c7245f8b065153f75fae:d9a3c8bc9226c46962b5a06f94599866372a6ae8cc13329a19a71b0c34b4c7d2";');
 const start=s.indexOf('function dbOpen(){'),end=s.indexOf('async function dbOp(',start);require(start>=0&&end>start,'database boundary');s=s.slice(0,start)+'function dbOpen(){throw Error("V12 database prohibited")}\n'+s.slice(end);
 s=once(s,'const getPart=id=>dbOp("readonly",o=>o.get(id));','const getPart=async id=>{requireV12Permit();check(id===0,"segment scope");return v12Record;};');
 s=once(s,'async function assemble(m,data,guard,verified){\n generationGate();','async function assemble(m,data,guard,verified){\n requireV12Permit();');
 s=once(s,'async function gpuSetup(preflightOnly=false,projectPayload=null){','async function gpuSetup(preflightOnly=false,projectPayload=null,nativeAdapter=null,outerGuard=null,consume=null){');
 s=once(s,'if(projectPayload){const result=await njStage.verify(T,scene,projectPayload);','if(projectPayload){check(v12Permit&&preflightOnly===true&&typeof nativeAdapter==="function"&&typeof consume==="function","V12 scoped GPU only");const result=await njStage.renderNativeV12(T,L,scene,renderer,device,projectPayload,nativeAdapter,()=>{outerGuard();check(!lost&&!gpuError,gpuError||"GPU lost")},consume);');
 s=once(s,'return {verify,bindNativeV10:(T,payload,adapter)=>adapter(T,payload,bindActor,arr)};\n})();',NATIVE_SOURCE+'\nreturn {verify,renderNativeV12,bindNativeV10:(T,payload,adapter)=>adapter(T,payload,bindActor,arr)};\n})();');
 const i=s.indexOf('$("njCheck").onclick=async()=>{');require(i>=0,'old handler boundary');s=s.slice(0,i)+CHILD_SOURCE+'\n'+s.slice(s.lastIndexOf('<'+'/script>'));
 require(s.includes('const GENERATION_ALLOWED=false,SCENE_READY=false;'),'original generation lock');return s;
}


const $=id=>document.getElementById(id);
let busy=false,stopped=false,prepared=false,verifiedWav=null,resultUrl=null;
function sync(){ $('go').disabled=busy||prepared||!$('art').files[0]||!$('wav5').files[0];$('art').disabled=busy||prepared;$('wav5').disabled=busy||prepared;}
$('art').onchange=$('wav5').onchange=sync;sync();
$('stop').onclick=()=>{stopped=true;$('status').textContent='停止要求を受け付けました'};
function guard(){require(!stopped,'stopped by user');require(!document.hidden,'Safari moved to background')}
function notify(r){$('log').value=JSON.stringify(r,null,2);$('progress').value=r.submitted||0;$('status').textContent=r.status==='FAIL'?'停止：'+r.error:({input:'入力照合',encode_init:'H.264準備',render:'冒頭を描画・エンコード',segment_finalize:'映像区間確定',segment_QA:'150F区間検査',assemble:'原曲AACと無再エンコード結合',final_QA:'最終MP4検査',complete:'完了'}[r.stage]||r.stage)+' '+(r.submitted||0)+'/150F'}
async function showResult(b,report){
 require(b instanceof Blob&&report.status==='PASS_TECHNICAL_PLAYBACK_PENDING','final result missing');
 resultUrl=URL.createObjectURL(b);const video=$('preview');video.hidden=false;
 const meta=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Safari metadata timeout')),15000);video.onloadedmetadata=()=>{clearTimeout(timer);resolve({width:video.videoWidth,height:video.videoHeight,duration:video.duration})};video.onerror=()=>{clearTimeout(timer);reject(Error('Safari MP4 metadata error'))};video.src=resultUrl;video.load()});
 require(meta.width===1920&&meta.height===1080&&Math.abs(meta.duration-5)<=.10,'Safari metadata mismatch');
 report.safari_metadata=meta;notify(report);$('save').href=resultUrl;$('save').hidden=false;$('status').textContent='技術検査合格。再生と美術を確認して保存してください。';$('retry').hidden=true;
}
async function launch(resume){
 if(busy)return;busy=true;stopped=false;sync();$('stop').disabled=false;$('retry').disabled=true;$('save').hidden=true;
 try{
  guard();let payload=null;
  if(!resume){
   const f=$('art').files[0],w=$('wav5').files[0];require(f?.size===44217141&&w?.size===960044,'入力サイズ不一致');
   const ab=await f.arrayBuffer();require(await sha(ab)==='e86b1d9d6bb03068f0b88ad3c1830912c7e85e9318a0c7245f8b065153f75fae','V11 SHA mismatch');
   verifiedWav=await w.arrayBuffer();require(await sha(verifiedWav)==='889bc4f9fb080c79e9be1976da9865dda9746b79d0df85647c1a3056e39ef1cc','5s WAV SHA mismatch');
   payload=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(ab));require(payload.config.project==='NanJaRo'&&payload.config.generation_allowed===false,'project lock');
   const r=await fetch('../nanjaro-actor-light-check/index.html',{cache:'no-store',credentials:'same-origin',redirect:'error'});require(r.ok,'pinned GPU source unavailable');
   const src=new TextDecoder('utf-8',{fatal:true}).decode(await r.arrayBuffer()),patched=patchV12(await patchPinnedActorSource(src)),frame=$('adapter');
   await new Promise((resolve,reject)=>{const timer=setTimeout(()=>{frame.onload=null;reject(Error('engine load timeout'))},15000);frame.onload=()=>{clearTimeout(timer);frame.onload=null;resolve()};frame.srcdoc=patched});
   require(typeof frame.contentWindow?.v12Run==='function','V12 engine missing');prepared=true;
  }
  const res=await $('adapter').contentWindow.v12Run(payload,bindNativeArt,verifiedWav,guard,notify,'動画生成開始',resume);
  if(res.blob)await showResult(res.blob,res.report);
  else{notify(res.report);$('retry').hidden=!res.report.can_resume_mux;$('retry').disabled=!res.report.can_resume_mux}
 }catch(e){$('status').textContent='停止：'+e.message;let prev={};try{prev=JSON.parse($('log').value)}catch{}$('log').value=JSON.stringify({...prev,status:'FAIL',error:String(e),playback:'UNVERIFIED'},null,2)}
 finally{busy=false;sync();$('stop').disabled=true}
}
$('go').onclick=()=>launch(false);$('retry').onclick=()=>launch(true);
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('log').value)}catch{$('log').focus();$('log').select()}};

</script></body></html>
