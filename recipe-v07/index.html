<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; connect-src 'self' https://cdn.jsdelivr.net; frame-src 'self' about:; img-src blob: data:; media-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>共通MV制作 V07｜制作準備</title><style>
:root{color-scheme:light dark;font:100% system-ui}*{box-sizing:border-box}body{margin:0;line-height:1.65}main{max-width:44rem;margin:auto;padding:1rem}section{border:1px solid #888;border-radius:.75rem;padding:1rem;margin:1rem 0}button,input{font:inherit;max-width:100%}button{width:100%;min-height:48px;border:1px solid #777;border-radius:.5rem;margin:.4rem 0;padding:.5rem;background:#2057a5;color:white;font-weight:650}button:disabled{background:#666}label{display:block;font-weight:650}input[type=file]{width:100%;min-height:48px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.85rem}iframe{width:100%;height:25rem;border:1px solid #888;border-radius:.5rem}h1{font-size:1.5rem}h2{font-size:1.2rem}:focus-visible{outline:3px solid #b45500;outline-offset:3px}a{color:inherit}[hidden]{display:none!important}#status{padding:.5rem;border:1px solid #888;border-radius:.5rem}progress{width:100%}
</style></head><body><main><h1>共通MV制作 V07｜制作準備</h1><p>V06で実機合格した2作品を引き継ぎます。動画・画像・音声出力は禁止のままです。</p><section><h2>1. 作品を選ぶ</h2><button id="dear">Dear Ga Ga.（30秒制作準備）</button><button id="sushi">SUSHI-JARO！（未完了項目を確認）</button><p id="status" role="status" aria-live="polite" aria-atomic="true">作品を選んでください。</p></section><section id="setup" hidden><h2>2. 原曲と保存区間</h2><label for="wav">既存原曲WAV（任意）</label><input id="wav" type="file" accept=".wav,audio/wav"><p>選択すると原曲と48〜78秒のPCMを端末内で照合。未選択でも制作準備の構成は確認できます。</p><button id="prepare">制作準備を確認（非生成）</button><p>既存V13の保存区間は読み取り専用で取得し、SHAを照合します。新しい区間は作成しません。GPUの合格済み検査は繰り返しません。</p></section><section><h2>3. 制作準備結果</h2><p id="verdict" role="status" aria-live="polite" aria-atomic="true">未実行</p><details><summary>技術情報</summary><pre id="log"></pre></details></section><iframe id="adapter" title="既存V05非生成制作準備エンジン" sandbox="allow-scripts allow-same-origin" hidden></iframe><noscript>JavaScriptが無効です。</noscript></main><script>
'use strict';
const PREP_SOURCE="\n // V07 read-only production preparation, not a generation entry point.\n async function checkpointInventory(){\n  const name=\"suilemo-v13-real-music-30s-v1\";\n  if(typeof indexedDB===\"undefined\"||typeof indexedDB.databases!==\"function\")return {status:\"UNVERIFIED_DATABASE_ENUMERATION\",reuse_candidates:[],read_only:true};\n  const list=await indexedDB.databases();\n  if(!list.some(x=>x.name===name))return {status:\"NO_EXISTING_DATABASE\",reuse_candidates:[],read_only:true};\n  let db=null;\n  try{\n   db=await new Promise((resolve,reject)=>{\n    const req=indexedDB.open(name);\n    req.onupgradeneeded=()=>{req.transaction.abort();reject(Error(\"V07: no database creation or upgrade\"))};\n    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error(\"V13 database busy\"));\n   });\n   check(db.objectStoreNames.contains(\"segments\"),\"existing checkpoint store missing\");\n   const records=await new Promise((resolve,reject)=>{\n    const tx=db.transaction(\"segments\",\"readonly\"),store=tx.objectStore(\"segments\"),items=[];\n    const req=store.openCursor();\n    req.onsuccess=()=>{const cur=req.result;if(cur){if(items.length>=PARTS){tx.abort();return}items.push(cur.value);cur.continue()}};\n    tx.oncomplete=()=>resolve(items);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(Error(\"checkpoint inventory stopped\"));\n   });\n   check(records.every((r,i)=>validRecord(r,i)&&r.imported!==true),\"checkpoint prefix or identity mismatch\");\n   const rows=[];\n   for(const r of records){check(await sha256(r.blob)===r.sha256,\"checkpoint SHA mismatch \"+r.id);rows.push({id:r.id,frames:r.count,bytes:r.bytes,sha256:r.sha256,packet_qa:\"REQUIRED_BEFORE_MUX\"})}\n   return {status:\"HASH_VERIFIED_REUSE_CANDIDATES\",reuse_candidates:rows,read_only:true};\n  }finally{db?.close()}\n }\n async function prepareProduction(file,inventory){\n  check(!GENERATION_ALLOWED,\"V07 generation must remain locked\");\n  const names={draw:gpuSetup,encode:renderPart,mux:assemble,inspect:inspectPart,packet_mux:muxPart,final_qa:probeFile,run};\n  check(Object.values(names).every(x=>typeof x===\"function\"),\"existing engine function missing\");\n  const storage=typeof navigator.storage?.estimate===\"function\"?storageGate(await navigator.storage.estimate()):{pass:false,reason:\"storage estimate unavailable\"};\n  const audio=file?await readSource(file):null;\n  const candidates=inventory?await checkpointInventory():{status:\"NOT_REQUESTED\",reuse_candidates:[]};\n  return {status:audio&&storage.pass?\"PREPARED_AWAITING_GENERATION_APPROVAL\":\"INPUT_OR_STORAGE_PENDING\",project:\"Dear Ga Ga.\",scope:\"30s_existing_V13_trial_only\",engine_functions:Object.keys(names),prior_gpu:\"V05_PASS_REUSED_NOT_RERUN\",prior_route:\"V06_PASS_REUSED\",recipe:RECIPE,frames:N,fps:FPS,width:W,height:H,source_start_seconds:p.recipe.start_song_seconds,source_audio:audio||\"FILE_PENDING\",storage,checkpoint_inventory:candidates,planned_segments:Array.from({length:PARTS},(_,id)=>({id,start:id*SEG,end_exclusive:(id+1)*SEG,action:candidates.reuse_candidates.some(x=>x.id===id)?\"REUSE_CANDIDATE_QA_REQUIRED\":\"FUTURE_RENDER_IF_MISSING\"})),assembly:\"existing assemble; H264/AAC; packet-preserving video\",approval:\"NOT_GRANTED\",generation_authorized:false,rendered:false,encoded:false,checkpoint_written:false,art_quality:\"UNVERIFIED_NEW_PATH\",resume_execution:\"NOT_RUN\"};\n }\n";

const PROTECTED_V05="d36b4c236036e48465615a69a144f91e8f411f41";
function prepareAdapter(html){
 check(html.includes('const GENERATION_ALLOWED=false,SCENE_READY=true;')&&html.includes('V05: checkpoint access prohibited'),'V05 safety lock mismatch');
 html=once(html,'return Object.freeze({bindingCheck,probe,verifyLocalAudio:readSource});',PREP_SOURCE+'\n return Object.freeze({bindingCheck,probe,verifyLocalAudio:readSource,prepareProduction});');
 html=once(html,"$('demo').addEventListener('click'", "window.v07Prepare=async(file,inventory)=>{const engine=createBoundEngine(DEMO);return engine.prepareProduction(file,inventory)};\n$('demo').addEventListener('click'");
 return html;
}


const $=id=>document.getElementById(id);
function check(ok,msg){if(!ok)throw Error(msg)}
function once(s,a,b){check(s.split(a).length===2,"protected source structure mismatch");return s.replace(a,()=>b)}
const hex=b=>Array.from(new Uint8Array(b),v=>v.toString(16).padStart(2,"0")).join("");
let busy=false,engine=null;
function lock(on){busy=on;for(const id of ["dear","sushi","wav","prepare"])$(id).disabled=on}
function report(r){$("log").textContent=JSON.stringify(r,null,2)}
async function loadEngine(){
 if(engine)return engine;
 const r=await fetch("../recipe-v05/index.html",{cache:"no-store",credentials:"same-origin",redirect:"error"});check(r.ok,"V05取得失敗");
 const b=new Uint8Array(await r.arrayBuffer()),h=new TextEncoder().encode("blob "+b.length+"\0"),x=new Uint8Array(h.length+b.length);x.set(h);x.set(b,h.length);
 check(hex(await crypto.subtle.digest("SHA-1",x))===PROTECTED_V05,"V05原本SHA不一致");
 const page=prepareAdapter(new TextDecoder("utf-8",{fatal:true}).decode(b)),f=$("adapter");
 await new Promise((resolve,reject)=>{const timer=setTimeout(()=>{f.onload=null;reject(Error("V05起動時間切れ"))},15000);f.onload=()=>{clearTimeout(timer);f.onload=null;resolve()};f.srcdoc=page});
 check(typeof f.contentWindow?.v07Prepare==="function","V07準備入口未接続");
 engine=f.contentWindow.v07Prepare;return engine;
}
$("dear").addEventListener("click",()=>{if(busy)return;$("setup").hidden=false;$("status").textContent="Dear Ga Ga.：V05・V06実機合格を継承。";$("verdict").textContent="原曲の選択は任意。制作準備を確認してください。";report({project:"Dear Ga Ga.",prior:"V06_PASS",generation_authorized:false})});
$("sushi").addEventListener("click",()=>{if(busy)return;$("setup").hidden=true;$("status").textContent="SUSHI-JARO！：V06の舞台・照明・人物API合格を継承。";$("verdict").textContent="制作保留：人物世界座標、初期原画、照明品質、150F以降の動作・全編時間軸が未確定です。";report({project:"SUSHI-JARO！",prior:"PASS_LIGHT_ACTOR_API_ONLY",frames_bound:150,world:"BLOCK_UNCALIBRATED",frame0:"ORIGINAL_ART_REQUIRED",lighting:"CANDIDATE_NOT_PHOTOMETRIC",full_timeline:"UNVERIFIED",generation_authorized:false,rendered:false})});
$("prepare").addEventListener("click",async()=>{if(busy)return;lock(true);$("status").textContent="既存エンジンと入力を読み取り専用で接続中。";$("verdict").textContent="確認中";try{const fn=await loadEngine(),r=await fn($("wav").files[0]||null,true);report(r);$("status").textContent="制作準備確認完了。画像・動画・音声生成なし。";$("verdict").textContent=r.status==="PREPARED_AWAITING_GENERATION_APPROVAL"?"原曲・容量確認済み。生成承認待ち。保存区間は再利用候補です。":"原曲または容量が未確認。生成はできません。"}catch(e){$("status").textContent="停止："+e.message;$("verdict").textContent="制作準備未完了。生成なし。";report({status:"BLOCK",error:String(e),generation_authorized:false})}finally{lock(false)}});

</script></body></html>
