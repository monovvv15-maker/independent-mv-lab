const getPart=id=>readOnly(o=>o.get(id));
function summary(a){if(!a?.length)return null;const b=[...a].sort((x,y)=>x-y);return {mean_ms:Number((a.reduce((s,x)=>s+x,0)/a.length).toFixed(2)),p95_ms:Number(b[Math.min(b.length-1,Math.floor(b.length*.95))].toFixed(2)),max_ms:Number(b[b.length-1].toFixed(2))};}
async function renderPart(m,id,data,guard){
 let gpu=null,output=null,finalized=false;const times=[],enc=[];const began=performance.now();
 try{
  guard();data.stage="gpu_init";gpu=await gpuSetup();data.backend=gpu.backend;data.effects=gpu.effects;
  data.stage="precompile";data.preflight=await gpu.preflight(id*SEG);guard();
  data.stage="segment_encode_init";
  const target=new m.BufferTarget();output=new m.Output({format:new m.Mp4OutputFormat(),target});
  const vs=new m.CanvasSource(gpu.canvas,{codec:"avc",fullCodecString:"avc1.640028",bitrate:8000000,keyFrameInterval:1,latencyMode:"quality"});
  output.addVideoTrack(vs,{frameRate:FPS});await deadline(output.start(),20000,"segment start");
  // Render the same start pose again after encoder initialization; no frames submitted.
  await gpu.frame(id*SEG);await delay();await gpu.frame(id*SEG);guard();
  for(let j=0;j<SEG;j++){
   guard();data.stage="render";let t=performance.now();await gpu.frame(id*SEG+j);times.push(performance.now()-t);guard();
   if(j<2){data.stage="initial_capture_sync";const ms=await initialCaptureSync();data.capture_sync.push({local_frame:j,global_frame:id*SEG+j,wait_ms:ms});guard();}
   data.stage="encode";t=performance.now();await deadline(vs.add(j/FPS,1/FPS,j===0?{keyFrame:true}:undefined),20000,"segment encode");enc.push(performance.now()-t);
   data.submitted=j+1;progress.value=data.submitted;
   $("status").textContent="対照試験｜"+data.submitted+" / 180 フレーム";
   if(j%10===0){show(data);await delay();}if(j>0&&j%30===0)await new Promise(r=>setTimeout(r,80));
  }
  guard();data.stage="segment_finalize";await deadline(output.finalize(),30000,"segment finalize");finalized=true;
  check(target.buffer&&target.buffer.byteLength>1024&&target.buffer.byteLength<=MAX_PART,"segment memory cap or empty MP4");
  const part=new Blob([target.buffer],{type:"video/mp4"});
  gpu.destroy();gpu=null;
  return {blob:part,bytes:part.size,sha256:await sha256(part),render_timing:summary(times),encode_timing:summary(enc),elapsed_s:Number(((performance.now()-began)/1000).toFixed(2))};
 }finally{if(output&&!finalized){try{await deadline(output.cancel(),3000,"cancel segment");}catch{}}if(gpu){gpu.destroy();}}
}

const ID=1,EXPECTED="a9af7ef08e040662f4fb1ed2d6a77f1b9f57b17901b5822dfc92aa62de5b3a9e";
function show(d){report.value=JSON.stringify(d,null,2);}
function summarizeMotion(d){
 check(d.length===SEG&&d[0]===null&&d.slice(1).every(Number.isFinite),"invalid motion series");
 const inside=d.slice(5,176).sort((a,b)=>a-b),med=inside[Math.floor(inside.length/2)],p95=inside[Math.floor(inside.length*.95)];
 const edgeIndices=[1,2,3,4,176,177,178,179],edges=edgeIndices.map(n=>({frame:n,mad:round(d[n])}));
 const staticFrames=d.slice(1).filter(x=>x<.1).length;
 const edgeStatic=edges.filter(x=>x.mad<.1).length;
 const jumps=edgeIndices.filter(n=>!jumpGate(d[n],[p95,med]));
 return {interior_median:round(med),interior_p95:round(p95),static_frames:staticFrames,edge_static_frames:edgeStatic,edge_samples:edges,edge_jump_frames:jumps,pass:med>.1&&edgeStatic===0&&jumps.length===0};
}
async function inspect(m,part,guard){
 const input=new m.Input({source:new m.BlobSource(part),formats:m.ALL_FORMATS});
 try{
 const v=await input.getPrimaryVideoTrack();check(v&&!(await input.getPrimaryAudioTrack()),"expected video-only track");
 const [stats,duration,width,height,codec,first]=await Promise.all([v.computePacketStats(),v.computeDuration(),v.getDisplayWidth(),v.getDisplayHeight(),v.getCodec(),v.getFirstTimestamp()]);
 check(stats.packetCount===SEG&&width===W&&height===H&&codec==="avc"&&Math.abs(duration-SEGSEC)<.05&&Math.abs(first)<.05,"segment metadata mismatch");
 const seen=new Set();let packetCount=0;
 for await(const p of new m.EncodedPacketSink(v).packets(undefined,undefined,{verifyKeyPackets:true})){
  guard();const n=frameIndex(p.timestamp,first);check(!seen.has(n),"duplicate packet PTS");seen.add(n);
  check(Math.abs(p.duration-1/FPS)<.002,"packet duration");if(!packetCount)check(n===0&&p.type==="key","missing first keyframe");packetCount++;
 }
 check(packetCount===SEG,"packet count mismatch");
 const sink=new m.CanvasSink(v,{width:THUMB_W,height:THUMB_H,fit:"contain"});
 const diffs=[null],frames=[];let n=0;
 for await(const f of sink.canvases()){
  guard();check(n<SEG&&Math.abs(f.timestamp-(first+n/FPS))<.002,"decoded PTS "+n);
  const x=thumb(f.canvas);if(n)diffs.push(mad(frames[n-1],x));frames.push(x);n++;
 }
 check(n===SEG,"decode count "+n);
 return {frames,metrics:{packets:packetCount,decoded:n,width,height,codec,duration,bytes:part.size,sha256:await sha256(part),motion:summarizeMotion(diffs),adjacent_mad:diffs.map(x=>x===null?null:round(x)),decoder_config:await configSignature(await v.getDecoderConfig())}};
 }finally{input.dispose();}
}
function compare(a,b){
 const same=a.frames.map((x,i)=>round(mad(x,b.frames[i])));
 const inside=same.slice(5,176).sort((a,b)=>a-b),med=inside[Math.floor(inside.length/2)];
 return {same_timestamp_interior_mad_median:med,edge_static_before:a.metrics.motion.edge_static_frames,edge_static_after:b.metrics.motion.edge_static_frames,edge_jumps_before:a.metrics.motion.edge_jump_frames,edge_jumps_after:b.metrics.motion.edge_jump_frames,after_motion_pass:b.metrics.motion.pass,decoder_config_match:a.metrics.decoder_config===b.metrics.decoder_config,interpretation:"stored control is V11a; compare exported V11d with independent V11c 6-second baseline to isolate initial synchronization; double rAF is not a guaranteed presentation fence"};
}
async function run(){
 if(active)return;active=true;aborted=false;go.disabled=true;stop.disabled=false;$("save").hidden=true;$("share").hidden=true;
 if(url){video.removeAttribute("src");video.load();URL.revokeObjectURL(url);url=null;}blob=null;video.hidden=true;progress.value=0;
 const begin=performance.now(),data={version:"V11d",stage:"read_control",status:"RUNNING",scope:"one_segment_initial_capture_sync",source_interval_s:[6,12],source_frame_range:[180,359],requested:{width:W,height:H,fps:FPS,frames:SEG,seconds:SEGSEC,audio:"none; matches original video-only checkpoint"},control_sha256:EXPECTED,submitted:0,media_generated:false,production_pass:false,original_write:false,render_thumbnail_readback:false,capture_sync_policy:"double_requestAnimationFrame_after_GPU_wait_first_two_frames_only",capture_sync:[]};
 const guard=()=>{check(!aborted,"stopped by user");check(!document.hidden,"Safari moved to background");check(performance.now()-begin<180000,"3 minute trial limit");};
 show(data);
 try{
  const m=await deadline(import("https://cdn.jsdelivr.net/npm/mediabunny@1.66.2/+esm"),30000,"Mediabunny");
  const work=async()=>{
   guard();const r=await getPart(ID);check(validRecord(r,ID),"original checkpoint unavailable; no generation");
   check(r.sha256===EXPECTED&&await sha256(r.blob)===EXPECTED,"original checkpoint SHA mismatch; no generation");
   $("status").textContent="旧区間の180Fを時系列デコード中";
   const base=await deadline(inspect(m,r.blob,guard),45000,"control decode");

   url=URL.createObjectURL(blob);video.src=url;video.hidden=false;video.load();$("save").href=url;$("save").hidden=false;$("share").hidden=false;
