</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><main><h1>V11i｜先頭4F接続診断</h1><p>GPU最終画素を直接RGBA入力としてエンコードし、同じ4Fの画素と時刻を照合。動画ファイル・画像・保存データは出力しません。結果JSONのみ。</p><section><p>Safariを前面に保ち、発熱したら停止してください。描画・エンコード各4Fのみ、再試行なし。</p><button id="go">接続診断開始</button><button id="stop" class="secondary" disabled>停止</button><div id="stage"></div><p id="status" role="status">未実行</p></section><section><button id="copy" class="secondary">結果をコピー</button><textarea id="report" readonly aria-label="検査結果"></textarea></section></main><script>
