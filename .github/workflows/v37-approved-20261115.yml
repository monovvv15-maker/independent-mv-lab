name: V37 one-time creator-approved full MV render
on:
  push:
    paths:
      - .github/workflows/v37-approved-20261115.yml
permissions:
  contents: read
jobs:
  render:
    if: github.event.head_commit.message == 'V37 author approved video generation 2026-11-15'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
      - name: Validate unique-clip plan and slow-motion limits
        run: python -m unittest -v test_v37.py
      - name: Render full 199-second no-repeat story rough
        run: python -u v37_unique_renderer.py --authorized --output v37_full_silent_199s.mp4
      - name: Verify movie size and duration
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('v37_full_silent_199s.mp4')
          assert p.exists() and p.stat().st_size>1000000
          import imageio_ffmpeg
          ffmpeg=imageio_ffmpeg.get_ffmpeg_exe()
          data=subprocess.run([ffmpeg,'-i',str(p)],capture_output=True,text=True).stderr
          assert 'Duration: 00:03:19.' in data or 'Duration: 00:03:20.' in data, data[-1500:]
          print('V37 duration verified; bytes',p.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v37-full-silent-nonrepeating-mv
          path: |
            v37_full_silent_199s.mp4
            v37_full_silent_199s.mp4.qa.json
          retention-days: 5
