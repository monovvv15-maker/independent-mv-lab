name: V28 all-selected footage QA (no render)
on:
  push:
    paths:
      - .github/workflows/v28-source-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
      - run: python -m unittest -v test_v26.py test_v27.py test_v28.py
      - name: Inspect all V27 selected clip bytes and representative stills
        run: python v28_sources.py
      - name: Save short-lived metadata and sampled stills only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v28-selected-footage-report
          path: |
            v28_review/report.json
            v28_review/stills/
          retention-days: 3
