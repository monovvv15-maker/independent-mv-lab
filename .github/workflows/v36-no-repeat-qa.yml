name: V36 non-repeating cinematic structure QA
on:
  push:
    paths:
      - .github/workflows/v36-no-repeat-qa.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_v36.py
      - run: python v36_no_repeat_qa.py
