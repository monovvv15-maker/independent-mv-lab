name: V42 private audio cue mapping QA - NO VIDEO
on:
  push:
    paths:
      - .github/workflows/v42-timing-qa.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Check V39/V41 drawing and V42 musical time remapping
        run: |
          python -m unittest -v test_v39.py test_v41.py test_v42.py
          python v42_timing_bridge.py
