name: Independent MV - free footage discovery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline adapter tests
        run: python -m unittest -v test_v03.py test_v06.py test_v08.py test_v09.py test_v10.py test_v11.py test_v12.py test_v13.py test_v14.py
      - name: Search live Wikimedia Commons video metadata
        run: python v06.py
      - name: Install free FFmpeg binary
        run: python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
      - name: Extract bounded frames from real free footage
        run: python v07_frames.py
      - name: Validate Mixkit clip licenses (no video download)
        run: python v08_mixkit.py
      - name: Produce V09 30-second editorial storyboard (no rendering)
        run: python v09_storyboard.py
      - name: V10 fail-closed audiovisual preflight (does not render)
        run: python v10_preflight.py
      - name: V11 inspect official Mixkit exposed previews (no MV render)
        run: python v11_clip_previews.py
      - name: V12 independent preflight (must remain blocked without visual and timing approval)
        run: python v12_gate.py
      - name: V13 export blocked edit-decision list
        run: python v13_edl.py
      - name: Upload review data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-footage-review
          path: discovery_output/
          retention-days: 3
