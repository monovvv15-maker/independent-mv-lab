name: V35 wet footsteps POV source check
on:
  push:
    paths:
      - .github/workflows/v35-wet-footsteps-qa.yml
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
      - run: python v35_wet_footsteps.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v35-pov-footsteps-review
          path: |
            v18_review/v18_report.json
            v18_review/stills/
          retention-days: 3
