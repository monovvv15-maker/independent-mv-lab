name: V34B small overlooked flower QA, no MV render
on:
  push:
    paths:
      - .github/workflows/v34b-flower-qa.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
      - run: python v34b_flower_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v34b-small-plant-stills
          path: |
            v18_review/v18_report.json
            v18_review/stills/
          retention-days: 5
