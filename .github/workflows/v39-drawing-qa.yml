name: V39 drawing story and title timing QA (NO MEDIA)
on:
  push:
    paths:
      - .github/workflows/v39-drawing-qa.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Verify script timeline and still pause without media export
        run: |
          python -m unittest -v test_v39.py
          python v39_progressive_drawing.py --check-only
