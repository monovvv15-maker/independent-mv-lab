name: V29 canonical storyboard and reuse mapping QA
on:
  push:
    paths:
      - .github/workflows/v29-story-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_v29.py
      - run: python v29_script_qa.py
      - name: Archive storyboard and inventory only, no video
        uses: actions/upload-artifact@v4
        with:
          name: v29-canonical-story-and-asset-map
          path: |
            scripts/EGACHAN_V29_CANONICAL_STORYBOARD_20261114.md
            catalog/v29_script_based_asset_map.json
          retention-days: 7
