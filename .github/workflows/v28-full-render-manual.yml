name: V28 full 199.872s silent MV rough - explicit start only
on:
  workflow_dispatch:
    inputs:
      confirm_video_generation:
        description: "Enter YES only after the author explicitly says 動画生成開始"
        required: true
        type: string
permissions:
  contents: read
jobs:
  full-rough:
    if: github.event.inputs.confirm_video_generation == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free licensed FFmpeg helper
        run: python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
      - name: Verify all source QA and full timing coverage
        run: |
          python -m unittest -v test_v28_renderer.py test_v28_final_prelaunch.py test_v28_full_private_mux.py
          python v28_final_prelaunch.py
      - name: Render full-length video without copyrighted private audio
        run: python v28_full_renderer.py --authorize-render --output v28_full_silent_rough_199s.mp4
      - name: Upload full-length silent rough
        uses: actions/upload-artifact@v4
        with:
          name: v28-full-length-silent-rough
          path: v28_full_silent_rough_199s.mp4
          retention-days: 3
