name: V34 verified editorial decisions no-render QA
on:
  push:
    paths:
      - .github/workflows/v34-editorial-gate.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_v33.py test_v34.py
      - run: python v34_editorial_gate.py
