name: V18B Neighborhood visual preflight
on:
  push:
    paths:
      - v18b_neighborhood_review.py
      - .github/workflows/v18b-neighborhood.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
      - name: Analyze temporary provider-downloaded footage
        run: python v18b_neighborhood_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v18b-neighborhood-review
          path: |
            v18_review/index.html
            v18_review/v18_report.json
            v18_review/stills/
          retention-days: 3
