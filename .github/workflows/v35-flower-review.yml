name: V35 check street flowers in real clips, no MV generation
on:
  push:
    paths:
      - .github/workflows/v35-flower-review.yml
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
      - name: Inspect sources and extract three stills each
        run: python v35_flower_review.py
      - name: Report successful acquisitions
        run: |
          python - <<'PY'
          import json
          r=json.load(open("v18_review/v18_report.json"))
          print([(x['id'],x['status']) for x in r])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v35-flowers-real-frame-review
          path: |
            v18_review/v18_report.json
            v18_review/stills/
          retention-days: 3
