const sha256=async b=>Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",await b.arrayBuffer())),n=>n.toString(16).padStart(2,"0")).join("");
function dbOpen(){return deadline(new Promise((resolve,reject)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{r.transaction.abort();reject(Error("V12保存領域が存在しません。再制作せず停止します。"));};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error("IndexedDB blocked"));}),15000,"checkpoint read-only open");}
async function dbOp(fn){const db=await dbOpen();try{return await deadline(new Promise((resolve,reject)=>{const tx=db.transaction("segments","readonly");let req;try{req=fn(tx.objectStore("segments"));}catch(e){tx.abort();reject(e);return;}tx.oncomplete=()=>resolve(req.result);tx.onerror=()=>reject(tx.error||req.error);tx.onabort=()=>reject(tx.error||Error("checkpoint transaction aborted"));}),20000,"checkpoint readonly transaction");}finally{db.close();}}
const getPart=id=>dbOp(o=>o.get(id));
const keys=()=>dbOp(o=>o.getAllKeys());
const EXPECTED=[
["6a9484089ffdeeb519b3bed5a339106e07f4b7057929a79fe0f6878442031d8e",4768480],
["bdbf84a543b575d03f244043384d0345f61447974a522f51ea1c8ede7eec6a68",3503144],
["ed1aad968e09044a0f6d0c9dc9c8815e2848f9494a39fdbde7916a0d962d7ff6",3684927],
["8afbe0593b5cec9d949f8ed6cd0589b80d289c506a9864d8768c18eee9861796",3845384],
["f1004aa06157fc49142cfb50cb0829462bb41883934637984c5dafbd6b219f26",4234727]];
function exactRecord(r,id){return validRecord(r,id)&&r.sha256===EXPECTED[id][0]&&r.bytes===EXPECTED[id][1]&&r.imported!==true&&Array.isArray(r.packet_hashes)&&r.packet_hashes.length===SEG&&r.packet_hashes.every(x=>/^[0-9a-f]{64}$/.test(x));}
async function refreshSaved(){try{const k=await keys();$("saved").textContent="保存区間："+k.length+" / "+PARTS+"（再開時にSHA検証）";}catch(e){$("saved").textContent="保存領域エラー："+String(e);}}
function frameIndex(t,start){const x=(t-start)*FPS,n=Math.round(x);check(Math.abs(x-n)<0.015&&n>=0&&n<SEG,"off-grid segment timestamp: "+t);return n;}
function validRecord(r,id){return r?.id===id&&r.recipe===RECIPE&&r.start===id*SEG&&r.count===SEG&&r.blob instanceof Blob&&r.blob.size===r.bytes&&r.bytes>1024&&r.bytes<=MAX_PART&&/^[0-9a-f]{64}$/.test(r.sha256);}
async function configSignature(c){
 check(c&&c.description&&c.codec&&c.codedWidth===W&&c.codedHeight===H,"missing AVC decoder config");
 const desc=c.description instanceof ArrayBuffer?new Uint8Array(c.description):new Uint8Array(c.description.buffer,c.description.byteOffset,c.description.byteLength);
 return JSON.stringify([c.codec,c.codedWidth,c.codedHeight,c.displayAspectWidth??null,c.displayAspectHeight??null,c.colorSpace?.primaries??null,c.colorSpace?.transfer??null,c.colorSpace?.matrix??null,c.colorSpace?.fullRange??null,await sha256(new Blob([desc]))]);
}

async function inspectPart(m,r,id,guard){
 check(exactRecord(r,id),"V12 exact checkpoint mismatch "+id);check(await sha256(r.blob)===r.sha256,"checkpoint SHA mismatch "+id);
 const input=new m.Input({source:new m.BlobSource(r.blob),formats:m.ALL_FORMATS});
 try{
  const v=await input.getPrimaryVideoTrack();check(v&&!(await input.getPrimaryAudioTrack()),"segment track mismatch");
  const sig=await configSignature(await v.getDecoderConfig());
  check(await v.getCodec()==="avc"&&await v.getDisplayWidth()===W&&await v.getDisplayHeight()===H,"segment resolution/codec");
  check(Math.abs(await v.computeDuration()-SEGSEC)<.005,"segment duration");
  const first=await v.getFirstTimestamp();check(Math.abs(first)<.002,"segment first PTS");
  const hashes=[],seen=new Set();let packets=0;
  for await(const p of new m.EncodedPacketSink(v).packets(undefined,undefined,{verifyKeyPackets:true})){
   guard();const n=frameIndex(p.timestamp,first);check(!seen.has(n)&&Math.abs(p.duration-1/FPS)<.002,"segment PTS");
   if(!packets)check(n===0&&p.type==="key","segment first keyframe");
   seen.add(n);hashes[n]=await hashBytes(p.data);packets++;
  }
  check(packets===SEG&&seen.size===SEG,"segment packet count");
  if(r.packet_hashes)check(r.packet_hashes.length===SEG&&hashes.every((x,i)=>x===r.packet_hashes[i]),"checkpoint packet hashes differ");
  const frames=[],diffs=[null],sink=new m.CanvasSink(v,{width:THUMB_W,height:THUMB_H,fit:"contain"});
  for await(const f of sink.canvases()){
   guard();const n=frames.length;check(n<SEG&&Math.abs(f.timestamp-first-n/FPS)<.002,"segment decoded PTS");
   const x=thumb(f.canvas),st=visualStats(x);check(st.sd>2&&st.mean>5&&st.mean<250,"segment invalid pixels");
   if(n)diffs.push(mad(frames[n-1],x));frames.push(x);
  }
  check(frames.length===SEG,"segment decoded count");
  const motion=summarizeMotion(diffs);check(motion.pass&&motion.static_frames===0,"segment motion gate "+id);
  const jumps=diffs.flatMap((x,k)=>k>1&&k<SEG-1&&!jumpGate(x,[diffs[k-1],diffs[k+1]])?[k]:[]);check(!jumps.length,"segment internal jump");
  let assessment;
  if(r.imported===true){
   check(id===1&&r.sha256===IMPORT_SHA&&r.bytes===3503144,"import identity");
   assessment={status:"V11J_EXACT_ORIGINAL_REUSE",output_motion:motion,qualification:"previous V11j input-output QA; exact MP4 SHA, current full decode"};
  }else{
   check(Array.isArray(r.raw)&&r.raw.length===SEG,"missing raw QA thumbnails");
   const q=assess(r.raw,frames);check(q.status==="TECHNICAL_CANDIDATE","input/output segment QA "+id+" "+JSON.stringify(compactAssessment(q)));assessment=compactAssessment(q);
  }
  return {frames,hashes,meta:{id,frames:SEG,bytes:r.bytes,sha256:r.sha256,config_signature:sig,visual:assessment}};
 }finally{input.dispose();}
}
async function muxPart(m,r,id,expected,guard,consume){
 check(exactRecord(r,id)&&r.sha256===expected.meta.sha256&&await sha256(r.blob)===r.sha256,"mux source changed");
 const input=new m.Input({source:new m.BlobSource(r.blob),formats:m.ALL_FORMATS});
 try{
  const v=await input.getPrimaryVideoTrack(),cfg=await v.getDecoderConfig(),sig=await configSignature(cfg),first=await v.getFirstTimestamp();
  check(sig===expected.meta.config_signature,"mux config changed");let count=0;const seen=new Set();
  for await(const p of new m.EncodedPacketSink(v).packets(undefined,undefined,{verifyKeyPackets:true})){
   guard();const n=frameIndex(p.timestamp,first);check(!seen.has(n)&&await hashBytes(p.data)===expected.hashes[n],"mux packet changed");seen.add(n);
   await consume(p,n,cfg,sig,count++);
  }check(count===SEG,"mux segment count");
 }finally{input.dispose();}
}
async function assemble(m,data,guard,verified){
 let output=null,finalized=false;
 try{
  const target=new m.BufferTarget();output=new m.Output({format:new m.Mp4OutputFormat(),target});
  const vs=new m.EncodedVideoPacketSource("avc"),as=new m.AudioBufferSource({codec:"aac",bitrate:192000});
  output.addVideoTrack(vs,{frameRate:FPS});output.addAudioTrack(as);await deadline(output.start(),20000,"assembly start");
  let signature=null,sequence=0,audioSec=0;
  for(let id=0;id<PARTS;id++){
   guard();const rec=await getPart(id);
   await muxPart(m,rec,id,verified[id],guard,async(pkt,n,cfg,sig,count)=>{
    if(signature===null)signature=sig;
    check(sig===signature,"AVC configuration differs across segments; safe stop, no remux");
    await deadline(vs.add(pkt.clone({timestamp:(id*SEG+n)/FPS,duration:1/FPS,sequenceNumber:sequence++}),count===0?{decoderConfig:cfg}:undefined),20000,"packet mux");
    // Interleave audio in approximately one-second steps to bound mux buffering.
    while(audioSec<D&&audioSec<=Math.floor((id*SEG+count)/FPS)){guard();await deadline(as.add(audioBuffer(audioSec++)),20000,"audio mux");}
   });
   data.muxed_video_packets=sequence;data.muxed_audio_seconds=audioSec;show(data);await delay();
  }
  while(audioSec<D){guard();await deadline(as.add(audioBuffer(audioSec++)),20000,"audio mux");}
  check(sequence===N&&audioSec===D,"assembly count mismatch");guard();
  await deadline(output.finalize(),45000,"assembly finalize");finalized=true;
  check(target.buffer&&target.buffer.byteLength<=MAX_FINAL&&target.buffer.byteLength>1024,"final memory cap or empty MP4");
  data.muxed_video_packets=sequence;data.muxed_audio_seconds=audioSec;
  return new Blob([target.buffer],{type:"video/mp4"});
 }finally{if(output&&!finalized){try{await deadline(output.cancel(),3000,"cancel assembly");}catch{}}}
}
async function run(){
 if(active)return;active=true;aborted=false;go.disabled=true;stop.disabled=false;$("save").hidden=true;$("share").hidden=true;
 if(url){video.removeAttribute("src");video.load();URL.revokeObjectURL(url);url=null;}blob=null;video.hidden=true;
 const begin=performance.now();
 const data={version:"V12a",stage:"init",scope:"v12_readonly_remux_audio_presentation_qa",recipe:RECIPE,requested:{width:W,height:H,fps:FPS,frames:N,seconds:D,video:"H.264",audio:"AAC-LC test tone",segments:PARTS,segment_seconds:SEGSEC},status:"RUNNING",media_generated:false,playback:"UNVERIFIED",submitted:0,committed_frames:0,segments:[],old_db_access:false,production_pass:false,gpu_redraw:false,video_reencode:false,checkpoint_write:false,thumbnail_readback:"128x72 stored GPU input and decoded output",planned_cumulative_copy_bytes:0,memory_policy:{max_segment_bytes:MAX_PART,max_final_bytes:MAX_FINAL,gpu_release_each_segment:true,actual_memory_usage:"UNMEASURABLE_IN_SAFARI"}};
 const guard=()=>{check(!aborted,"stopped by user");check(performance.now()-begin<300000,"5 minute processing limit; resume saved segments");check(!document.hidden,"Safari moved to background");};
 show(data);progress.value=0;
 async function work(){
  guard();const m=await deadline(import("https://cdn.jsdelivr.net/npm/mediabunny@1.66.2/+esm"),30000,"Mediabunny");
  for(const k of ["Output","Mp4OutputFormat","BufferTarget","AudioBufferSource","AudioSampleSink","Input","BlobSource","EncodedVideoPacketSource","EncodedPacketSink","CanvasSink"])check(typeof m[k]==="function","missing "+k);
  data.stage="checkpoint_scan";const saved=await keys();check(saved.length===PARTS&&saved.every((k,i)=>k===i),"全5区間が必要です。再描画せず停止します。");
  const verified=[];
  for(let id=0;id<PARTS;id++){
   guard();const r=await getPart(id);data.stage="checkpoint_resume";const q=await inspectPart(m,r,id,guard);verified.push(q);data.segments.push({...q.meta,source:"reused_exact_v12"});
   if(id>0){const left=verified[id-1].frames,right=verified[id].frames,edge=mad(left[SEG-1],right[0]);check(boundaryGate(edge,mad(left[SEG-2],left[SEG-1]),mad(right[0],right[1])),"checkpoint boundary gate at "+id*SEG);}
   data.committed_frames=(id+1)*SEG;data.submitted=data.committed_frames;progress.value=data.committed_frames;show(data);await refreshSaved();
   await delay();
  }
  guard();data.stage="assemble";$("status").textContent="5区間を再エンコードなしで結合中";show(data);
  blob=await assemble(m,data,guard,verified);data.media_generated=true;guard();
  data.stage="verify";data.file=await deadline(probeFile(m,blob,verified,guard),120000,"final MP4 QA");
  data.technical_pass=evaluate(data.file)&&data.file.visual.pass===true&&data.file.audio.pass===true;check(data.technical_pass,"MP4 QA mismatch: "+JSON.stringify({metadata:evaluate(data.file),video:data.file.visual.pass,audio:data.file.audio.pass,audio_checks:data.file.audio.checks}));
  url=URL.createObjectURL(blob);video.hidden=false;data.safari_metadata=await metadataCheck();
  check(data.safari_metadata.width===W&&data.safari_metadata.height===H&&Math.abs(data.safari_metadata.duration-D)<=0.10,"Safari metadata mismatch");
  data.stage="complete";data.status="PASS_TECHNICAL_PLAYBACK_PENDING";data.playback="USER_CHECK_REQUIRED";
  $("save").href=url;$("save").hidden=false;$("share").hidden=false;
  $("status").textContent="30秒MP4検査合格。再生・保存してください。区間データは保持してください。";
 }
 try{
  if(navigator.locks){await navigator.locks.request(DBNAME,{ifAvailable:true},async lock=>{check(lock,"V12 is running in another tab");await work();});}
  else await work();
 }catch(e){data.status=aborted?"STOPPED":data.stage==="precompile"?"PRECOMPILE_FAIL":"FAIL";data.error=String(e);if(e.preflight)data.preflight=e.preflight;$("status").textContent=data.status+"｜"+data.error+"｜保存済み区間は保持";}
 finally{data.elapsed_s=Number(((performance.now()-begin)/1000).toFixed(2));show(data);active=false;go.disabled=false;stop.disabled=true;await refreshSaved();}
}
go.onclick=()=>run();
stop.onclick=()=>{aborted=true;$("status").textContent="停止要求中（保存済み区間は保持）";};
refreshSaved();
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(report.value);$("copy").textContent="コピー済み";}catch{report.focus();report.select();}};
$("share").onclick=async()=>{try{const file=new File([blob],"suilemo_mobile_v12a_test.mp4",{type:"video/mp4"});if(!navigator.canShare?.({files:[file]}))throw Error("共有非対応：MP4保存を使用");await navigator.share({files:[file]});}catch(e){if(e.name!=="AbortError")$("status").textContent=String(e);}};
show({version:"V12a",status:"NOT_RUN",media_generated:false});
</script></body></html>
